# ========================================== #
#      КОМАНДЫ (HELP)                        #
# ========================================== #
# Единый формат для всех help-выводов плагина: разделитель, список
# "<aqua>/команда аргументы</aqua> <gray>- описание</gray>", разделитель.
help-header: "<dark_gray>========== <gold>LoveHunt Помощь</gold> ==========</dark_gray>"
help-main: "<aqua>/lovehunt</aqua> <gray>- Открыть главное меню розыска (алиасы: /hunt, /охота)</gray>"
help-hunts: "<aqua>/hunts</aqua> <gray>- Открыть список всех активных розысков</gray>"
help-create: "<aqua>/lovehunt create</aqua> <gray>- Создать розыск (награда берётся из руки)</gray>"
help-cancel: "<aqua>/lovehunt cancel</aqua> <gray>- Отменить текущий ввод</gray>"
help-stats: "<aqua>/lovehunt stats [игрок]</aqua> <gray>- Показать статистику охотника</gray>"
help-top: "<aqua>/lovehunt top</aqua> <gray>- Топ охотников сервера</gray>"
help-lovehuntadmin: "<aqua>/lovehuntadmin</aqua> <gray>- Административные команды LoveHunt</gray>"
help-footer: "<dark_gray>=========================================</dark_gray>"

# ========================================== #
#      АДМИН-КОМАНДА (/lovehuntadmin)        #
# ========================================== #
admin-help-header: "<dark_gray>========== <gold>LoveHunt Admin</gold> ==========</dark_gray>"
admin-help-reload: "<aqua>/lovehuntadmin reload [all|config|message]</aqua> <gray>- Перезагрузить конфигурацию и/или сообщения</gray>"
admin-help-block: "<aqua>/lovehuntadmin block <игрок> <create|accept></aqua> <gray>- Запретить игроку действие</gray>"
admin-help-unblock: "<aqua>/lovehuntadmin unblock <игрок> <create|accept></aqua> <gray>- Снять запрет с игрока</gray>"
admin-help-create: "<aqua>/lovehuntadmin create <player|clan|server> <игрок> <кол-во> [материал]</aqua> <gray>- Создать розыск от имени администратора</gray>"
admin-help-npc: "<aqua>/lovehuntadmin npc <bind|unbind></aqua> <gray>- Привязать/отвязать NPC пункта сдачи трофеев</gray>"
admin-help-footer: "<dark_gray>=========================================</dark_gray>"

