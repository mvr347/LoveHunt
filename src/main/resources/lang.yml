# 2026-10-14: событийные уведомления игроку (результат создания/продления/отмены розыска, награда,
# сдача трофея, отказы в меню и у NPC) идут через LoveNotify из LoveCore, а не напрямую в чат:
# по умолчанию игрок видит их в экшнбаре, а в чат они попадают, если текст длиннее лимита LoveCore или
# сообщение критичное (награда, списание/возврат награды заказа, отмена розыска). Поэтому такие тексты
# держите короткими. Ответы на команды, ошибки ввода, подсказки ввода и реплики NPC остаются в чате,
# и префикс "prefix" к уведомлениям не добавляется, чтобы они помещались в экшнбар.
# 2026-10-19: версия языкового файла. copyDefaults не обновляет уже существующие строки, поэтому тексты меню, переписанные
# по стандарту оформления лора, не дошли бы до серверов со старым lang.yml. При переходе на новую версию LangMigrator берёт
# разделы style и gui из jar заново (правки админа в них пропадают), а прежний файл сохраняется рядом как lang.yml.v<версия>.bak.
# Меняете оформление меню - поднимайте версию и добавляйте шаг в LangMigrator.
